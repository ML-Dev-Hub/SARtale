name: Rebuild the lake data
description: >
  Search, fetch and build every watched lake from processing/lakes_in.json, work out which lakes are frozen
  (lakes-freeze), check against Sentinel-2 the lakes without a current check (lakes-check --stale-only), compare
  the build with the published
  lakes.json, then run the Python and app tests. Fails on any error, including the Attabad gate, a search that
  finds no pass for any lake, and a build that would drop more than a quarter of the published passes. The caller
  passes EARTHDATA_USERNAME and EARTHDATA_PASSWORD through `env:` on the step that uses this action; they are
  written to a temporary ~/.netrc only for the fetch.

runs:
  using: composite
  steps:
    - name: Set up the Python environment
      # the accept job sets it up earlier (it edits lakes_in.json before the rebuild)
      if: env.SARTALE_ENV_READY != '1'
      uses: mamba-org/setup-micromamba@add3a49764cedee8ee24e82dfde87f5bc2914462 # v2
      with:
        environment-file: environment.yml
        environment-name: sartale
        cache-environment: true
        init-shell: bash

    - name: Restore the NISAR window cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: data/lakes
        key: lakes-${{ hashFiles('processing/lakes_in.json') }}-${{ github.run_id }}
        restore-keys: |
          lakes-

    - name: Write the temporary Earthdata login
      shell: bash
      run: |
        set +x
        : "${EARTHDATA_USERNAME:?EARTHDATA_USERNAME is not set}"
        : "${EARTHDATA_PASSWORD:?EARTHDATA_PASSWORD is not set}"
        umask 077
        printf 'machine urs.earthdata.nasa.gov login %s password %s\n' \
          "$EARTHDATA_USERNAME" "$EARTHDATA_PASSWORD" > ~/.netrc
        chmod 600 ~/.netrc

    - name: Search the catalogue
      shell: bash -el {0}
      working-directory: processing
      run: python -m sartale.run_pipeline lakes-search

    - name: Fetch the passes (retried once; at most 12 lakes new to the cache per run)
      # A lake with no cached window yet costs a full fetch of every pass; the rest wait for next week's run.
      shell: bash -el {0}
      working-directory: processing
      run: |
        python -m sartale.run_pipeline lakes-fetch --max-new-lakes 12 || {
          echo "lakes-fetch failed; retrying once"
          python -m sartale.run_pipeline lakes-fetch --max-new-lakes 12
        }

    - name: Remove the Earthdata login
      if: always()
      shell: bash
      run: rm -f ~/.netrc

    - name: Shrink the NISAR window cache (cropped float16 windows, listed passes and register lakes only)
      # Crops any window still at the full 6 km in float32/64 (a cache saved before the crop), so the build reads
      # the same windows as a fresh fetch, and keeps the saved cache small. Needs no login.
      shell: bash -el {0}
      working-directory: processing
      run: |
        unset EARTHDATA_USERNAME EARTHDATA_PASSWORD
        python -m sartale.run_pipeline lakes-cache-shrink

    - name: Save the NISAR window cache
      # only after a fetch that went through; a failed one keeps the last good cache
      if: success()
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: data/lakes
        key: lakes-${{ hashFiles('processing/lakes_in.json') }}-${{ github.run_id }}

    - name: Keep the published lakes.json for the comparison
      shell: bash
      run: |
        if git show HEAD:app/public/data/lakes.json > "$RUNNER_TEMP/lakes.published.json" 2>/dev/null; then
          echo "kept the published lakes.json"
        else
          rm -f "$RUNNER_TEMP/lakes.published.json"
          echo "no published lakes.json to compare with"
        fi

    - name: Re-check the sites with no lake now (Sentinel-2, all year, clear and snow-free scenes only)
      # Before the build, on the published lakes.json: the absence check reads no build output, and the build that
      # follows carries the new evidence, so a site where a lake may be forming keeps its radar water layer in this
      # same refresh. When no scene qualifies, or the search fails, the last evidence stands and the site says that
      # no clear, snow-free view has come since.
      shell: bash -el {0}
      working-directory: processing
      run: |
        unset EARTHDATA_USERNAME EARTHDATA_PASSWORD
        python -m sartale.run_pipeline lakes-absence

    - name: Measure the surface height of any lake that has none (Copernicus DEM, for the freeze check)
      # A newly accepted lake gets its height here, in lakes_in.json, before the build and the freeze check. Needs no
      # login. Fails soft: a lake whose height cannot be read stays "freeze not assessed" and is tried again next time.
      shell: bash -el {0}
      working-directory: processing
      run: |
        unset EARTHDATA_USERNAME EARTHDATA_PASSWORD
        python -m sartale.run_pipeline lakes-elevation

    - name: Build the lakes (fails when the Attabad gate fails)
      shell: bash -el {0}
      working-directory: processing
      run: |
        unset EARTHDATA_USERNAME EARTHDATA_PASSWORD
        python -m sartale.run_pipeline lakes-build

    - name: Check the sites with no lake now that have no evidence yet
      # a site new to the register (not in the published lakes.json, so skipped above) gets its first check here
      shell: bash -el {0}
      working-directory: processing
      run: |
        unset EARTHDATA_USERNAME EARTHDATA_PASSWORD
        python -m sartale.run_pipeline lakes-absence --only-missing

    - name: Check which lakes are frozen (NASA POWER air temperature, Sentinel-2 for cold lakes)
      # After the build: flags the passes taken while a lake was frozen and sets the frozen statuses. Needs no login
      # (NASA POWER and Earth Search are open). A failed download never fails the run: that lake is "not assessed"
      # and keeps the usual assessment.
      shell: bash -el {0}
      working-directory: processing
      run: |
        unset EARTHDATA_USERNAME EARTHDATA_PASSWORD
        python -m sartale.run_pipeline lakes-freeze

    - name: Check against Sentinel-2 the lakes whose check is missing or stale
      # After the freeze check: a lake gets a level only with a current Sentinel-2 check (made for this water method,
      # zone and lake point; the others are reused from the published lakes.json). Needs no login (Earth Search is
      # open). Fails soft inside the command: a failed check leaves that lake "Not yet validated against Sentinel-2".
      shell: bash -el {0}
      working-directory: processing
      run: |
        unset EARTHDATA_USERNAME EARTHDATA_PASSWORD
        python -m sartale.run_pipeline lakes-check --stale-only

    - name: Compare with the published passes (fails when too many would be dropped)
      shell: bash -el {0}
      working-directory: processing
      run: |
        unset EARTHDATA_USERNAME EARTHDATA_PASSWORD
        python -m sartale.run_pipeline lakes-diff --old "$RUNNER_TEMP/lakes.published.json"

    - name: Python tests
      shell: bash -el {0}
      working-directory: processing
      run: |
        unset EARTHDATA_USERNAME EARTHDATA_PASSWORD
        pytest tests -q

    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: app/package-lock.json

    - name: App tests
      shell: bash
      working-directory: app
      run: |
        unset EARTHDATA_USERNAME EARTHDATA_PASSWORD
        npm ci --ignore-scripts  # no package install scripts; tests and build pass without them
        npm test -- --run
