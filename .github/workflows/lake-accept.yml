name: Accept a lake request

# Runs when someone adds `accepted` to a lake-request issue, or when it is started for a waiting accept: by the
# check job (one per run, daily at the latest), by the drain step that ends every accept and refresh publish job,
# or by itself after a stale base. Three jobs, so that no job holds both a write token and the
# Earthdata login:
#   gate     (read only)                     who approved, and do they have write, maintain or admin?
#   rebuild  (earthdata, read only)          add the lake, rebuild, test, upload the data as an artifact
#   publish  (write, no Earthdata, no build) check the artifact, re-read the issue live, commit, comment;
#                                            reports every failure
# Issue text is never put into a script; the issue number goes through env and must be digits.
# A rebuild whose inputs changed on main meanwhile is started again (input `attempt`, at most 3 runs) instead
# of being reported as failed. A rebuild queued out of `sartale-rebuild` before it started ends quietly: it
# neither starts itself again nor reports, and the drain step of a later publish starts it again.

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: Number of the lake-request issue that carries `accepted`
        required: true
        type: string
      attempt:
        description: Which try this is (1 to 3); set by the workflow when it starts itself again
        required: false
        default: "1"
        type: string

env:
  ISSUE: ${{ github.event.issue.number || inputs.issue }}
  ATTEMPT: ${{ inputs.attempt || '1' }}
  GH_REPO: ${{ github.repository }}

jobs:
  gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'accepted' && contains(github.event.issue.labels.*.name, 'lake-request'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
    outputs:
      decision: ${{ steps.perm.outputs.decision }}
      approved_at: ${{ steps.perm.outputs.approved_at }}
      approver: ${{ steps.perm.outputs.approver }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false

      - name: Check who approved
        id: perm
        env:
          GH_TOKEN: ${{ github.token }}
          SENDER: ${{ github.event.sender.login }}
          LABELED_AT: ${{ github.event.issue.updated_at }}
          EVENT: ${{ github.event_name }}
        run: |
          decide() { echo "decision=$1" >> "$GITHUB_OUTPUT"; echo "decision: $1"; }
          case "$ISSUE" in
            ''|*[!0-9]*) echo "the issue number must be digits" >&2; decide skip; exit 0 ;;
          esac
          if [ "$EVENT" = workflow_dispatch ]; then
            # started by the check job or by this workflow: ask the issue's events who added the label
            set +e
            found="$(python3 .github/scripts/approver.py --issue "$ISSUE")"
            code=$?
            set -e
            case "$code" in
              0) ;;
              3) decide skip; exit 0 ;;          # no longer an open request carrying `accepted`
              4) decide refuse-lookup; exit 0 ;; # carries `accepted`, but no valid sender was found
              *) exit 1 ;;
            esac
            approver="$(printf '%s\n' "$found" | sed -n 1p)"
            approved_at="$(printf '%s\n' "$found" | sed -n 2p)"
          else
            approver="$SENDER"         # the account that just added the label
            approved_at="$LABELED_AT"  # when it did: the event's issue update time, not this run's clock
            if ! printf '%s' "$approved_at" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'; then
              echo "the label event carries no usable time" >&2
              decide refuse-lookup; exit 0
            fi
          fi
          # no usable time or sender: the team check could not be made, which is not a refusal of anyone
          if ! printf '%s' "$approver" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9-]*$'; then
            decide refuse-lookup; exit 0
          fi
          lookup() { gh api "repos/$GITHUB_REPOSITORY/collaborators/$approver/permission" --jq .permission; }
          # a lookup that fails twice is no answer about the person: say the check could not be made
          perm="$(lookup)" || { sleep 5; perm="$(lookup)"; } || perm=unknown
          echo "approver $approver has permission $perm"
          case "$perm" in
            admin|maintain|write)
              echo "approved_at=$approved_at" >> "$GITHUB_OUTPUT"
              echo "approver=$approver" >> "$GITHUB_OUTPUT"
              decide allowed ;;
            unknown) decide refuse-lookup ;;
            *) decide refuse-team ;;
          esac

  rebuild:
    needs: gate
    if: needs.gate.outputs.decision == 'allowed'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: earthdata
    permissions:
      contents: read
      issues: read
    # one rebuild at a time: two would fetch the same windows twice and the second would be refused at
    # publish anyway (its inputs are older than main); a rebuild dropped from the queue is started again
    concurrency:
      group: sartale-rebuild
      cancel-in-progress: false
    outputs:
      started: ${{ steps.started.outputs.started }}
      decision: ${{ steps.add.outputs.decision }}
    steps:
      - id: started  # tells publish a cancelled run had started (a failure) or was queued out (start again)
        run: echo "started=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false

      - uses: mamba-org/setup-micromamba@add3a49764cedee8ee24e82dfde87f5bc2914462 # v2
        with:
          environment-file: environment.yml
          environment-name: sartale
          cache-environment: true
          init-shell: bash

      - name: Tell the rebuild action the environment is ready
        run: echo "SARTALE_ENV_READY=1" >> "$GITHUB_ENV"

      - name: List every lake request
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 .github/scripts/fetch_issues.py --out "$RUNNER_TEMP/issues.json"
          --confirmed-from app/public/data/requests.json

      - name: Add the lake to lakes_in.json
        id: add
        shell: bash -el {0}
        working-directory: processing
        env:
          APPROVED_AT: ${{ needs.gate.outputs.approved_at }}
        run: |
          decide() { echo "decision=$1" >> "$GITHUB_OUTPUT"; echo "decision: $1"; }
          if [ "$(python3 ../.github/scripts/waiting.py "$RUNNER_TEMP/issues.json" "$ISSUE")" != yes ]; then
            echo "issue #$ISSUE no longer carries accepted, or is closed; nothing to do"
            decide skip
            exit 0
          fi
          if [ "$(python3 ../.github/scripts/feed_state.py ../app/public/data/requests.json "$ISSUE")" = accepted ]; then
            echo "issue #$ISSUE is already accepted; nothing to rebuild"
            decide done
            exit 0
          fi
          set +e
          python -m sartale.run_pipeline lake-issue-accept --issues "$RUNNER_TEMP/issues.json" \
            --feed ../app/public/data/requests.json --issue "$ISSUE" --lakes-in lakes_in.json \
            --today "$(date -u +%F)" --approved-at "$APPROVED_AT" --actions "$RUNNER_TEMP/actions.json" \
            2> "$RUNNER_TEMP/accept.err"
          code=$?
          set -e
          cat "$RUNNER_TEMP/accept.err" >&2
          if [ "$code" -eq 0 ]; then
            decide rebuild
          elif [ "$code" -eq 1 ] && grep -qx 'lake-issue-accept: This request changed after it was approved. A team member must accept it again.' "$RUNNER_TEMP/accept.err"; then
            decide refuse-changed
          elif [ "$code" -eq 1 ] && grep -qx 'lake-issue-accept: This request was approved before the new check existed. A team member must accept it again.' "$RUNNER_TEMP/accept.err"; then
            decide refuse-migrated
          elif [ "$code" -eq 1 ] && grep -q '^lake-issue-accept: ' "$RUNNER_TEMP/accept.err"; then
            decide refuse-unchecked
          else
            exit 1
          fi

      - name: Rebuild the lake data
        if: steps.add.outputs.decision == 'rebuild'
        timeout-minutes: 330  # below the job's 360, so the publish job can still report a timeout
        uses: ./.github/actions/rebuild
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}

      - name: Pack the rebuilt data
        if: steps.add.outputs.decision == 'rebuild'
        run: python3 .github/scripts/data_artifact.py pack --repo . --out "$RUNNER_TEMP/lake-data"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.add.outputs.decision == 'rebuild'
        with:
          name: lake-data
          path: ${{ runner.temp }}/lake-data
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [gate, rebuild]
    # refusals, a finished rebuild, and every rebuild failure or timeout (reported from here). A rebuild that
    # decided 'done' or 'skip' still held the rebuild queue, so publish runs for it too, but only to drain.
    if: >-
      always() && (needs.gate.outputs.decision == 'refuse-team' || needs.gate.outputs.decision == 'refuse-lookup' ||
      needs.gate.outputs.decision == 'allowed')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      actions: write
    concurrency:
      group: sartale-data
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false

      - name: Refuse an approval from outside the team, or one whose sender could not be checked
        if: needs.gate.outputs.decision == 'refuse-team' || needs.gate.outputs.decision == 'refuse-lookup'
        env:
          GH_TOKEN: ${{ github.token }}
          DECISION: ${{ needs.gate.outputs.decision }}
        run: |
          if [ "$DECISION" = refuse-lookup ]; then
            printf '%s\n' "SARtale could not check who added the label; a team member can add it again." \
              > "$RUNNER_TEMP/refused.md"
          else
            printf '%s\n' "Only the SARtale team can accept a request." > "$RUNNER_TEMP/refused.md"
          fi
          gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/refused.md"
          gh issue edit "$ISSUE" --remove-label accepted

      - name: Refuse a request that cannot be accepted
        if: >-
          needs.rebuild.outputs.decision == 'refuse-changed' ||
          needs.rebuild.outputs.decision == 'refuse-migrated' ||
          needs.rebuild.outputs.decision == 'refuse-unchecked'
        env:
          GH_TOKEN: ${{ github.token }}
          DECISION: ${{ needs.rebuild.outputs.decision }}
        run: |
          if [ "$DECISION" = refuse-changed ]; then
            printf '%s\n' "This request changed after it was approved. A team member must accept it again." \
              > "$RUNNER_TEMP/refused.md"
          elif [ "$DECISION" = refuse-migrated ]; then
            printf '%s\n' "This request was approved before the new check existed. A team member must accept it again." \
              > "$RUNNER_TEMP/refused.md"
          else
            printf '%s\n' "This request has no checked entry that can be accepted, so nothing was rebuilt." \
              > "$RUNNER_TEMP/refused.md"
          fi
          gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/refused.md"
          gh issue edit "$ISSUE" --remove-label accepted

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.rebuild.result == 'success' && needs.rebuild.outputs.decision == 'rebuild'
        with:
          name: lake-data
          path: ${{ runner.temp }}/lake-data

      - name: Check and install the data
        id: install
        if: needs.rebuild.result == 'success' && needs.rebuild.outputs.decision == 'rebuild'
        run: |
          set +e
          python3 .github/scripts/data_artifact.py unpack --repo . --from "$RUNNER_TEMP/lake-data" &&
            python3 .github/scripts/data_artifact.py accept --repo . --from "$RUNNER_TEMP/lake-data" \
              --issue "$ISSUE" --actions "$RUNNER_TEMP/actions.json"
          code=$?
          set -e
          case "$code" in
            0) echo "result=ok" >> "$GITHUB_OUTPUT" ;;
            5) echo "result=changed" >> "$GITHUB_OUTPUT" ;;  # edited during the rebuild: refuse, publish nothing
            6) echo "result=stale" >> "$GITHUB_OUTPUT" ;;    # main changed the inputs meanwhile: start again
            *) exit "$code" ;;
          esac

      - name: Re-read the issue live just before publishing
        # still open and accepted, by the same approver at the same time, who still has write access, with the
        # values the rebuild used; otherwise nothing is published and the issue says why (a fixed sentence, never
        # issue text). When the approval itself is void (values edited, approver lost access; exit 8), `accepted`
        # is removed as well, as for a request refused as changed, so adding it again starts a new check.
        id: live
        if: steps.install.outputs.result == 'ok'
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVER: ${{ needs.gate.outputs.approver }}
          APPROVED_AT: ${{ needs.gate.outputs.approved_at }}
        run: |
          set +e
          python3 .github/scripts/live_approval.py --issue "$ISSUE" --approver "$APPROVER" \
            --approved-at "$APPROVED_AT" --from "$RUNNER_TEMP/lake-data" --why "$RUNNER_TEMP/live.md"
          code=$?
          set -e
          case "$code" in
            0) echo "result=ok" >> "$GITHUB_OUTPUT" ;;
            7) echo "result=withdrawn" >> "$GITHUB_OUTPUT"
               gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/live.md" ;;
            8) echo "result=withdrawn" >> "$GITHUB_OUTPUT"
               gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/live.md"
               gh issue edit "$ISSUE" --remove-label accepted ;;
            *) exit "$code" ;;
          esac

      - name: Refuse a request that changed during the rebuild
        if: steps.install.outputs.result == 'changed'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' "This request changed after it was approved. A team member must accept it again." \
            > "$RUNNER_TEMP/refused.md"
          gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/refused.md"
          gh issue edit "$ISSUE" --remove-label accepted

      - name: Note an accept that never started
        # queued out of sartale-rebuild by a newer accept or refresh: no comment, no label, no new run; the
        # drain step of a later publish (or the daily check) starts it again
        if: always() && needs.rebuild.result == 'cancelled' && needs.rebuild.outputs.started != 'true'
        run: |
          printf 'The rebuild for issue #%s was queued out before it started; a later run starts it again.\n' \
            "$ISSUE" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the new lake and start the deploy
        id: commit
        if: steps.install.outputs.result == 'ok' && steps.live.outputs.result == 'ok'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |  # a block: in a plain YAML scalar " #" would start a comment and cut the command
          # exit 6: main changed the data or the method code between the checkout and the push; nothing was
          # pushed, and the accept starts again like any stale base
          set +e
          DATA_ARTIFACT="$RUNNER_TEMP/lake-data" \
            bash .github/scripts/commit-data.sh "Add requested lake from issue #$ISSUE" processing/lakes_in.json app/public/data
          code=$?
          set -e
          case "$code" in
            0) ;;
            6) echo "result=stale" >> "$GITHUB_OUTPUT" ;;
            *) exit "$code" ;;
          esac

      - name: Comment and close the issue
        if: >-
          steps.install.outputs.result == 'ok' && steps.live.outputs.result == 'ok' &&
          steps.commit.outputs.result != 'stale'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/apply-actions.sh "$RUNNER_TEMP/actions.json"

      - name: Start the accept again, or give up after three tries
        # the data were built on an older main (found at unpack, or after the rebase just before the push); only
        # these stale-base outcomes count towards the three tries. It runs after the commit step for that reason.
        id: again
        if: >-
          always() && needs.gate.outputs.decision == 'allowed' &&
          (steps.install.outputs.result == 'stale' || steps.commit.outputs.result == 'stale')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$ATTEMPT" in
            ''|*[!0-9]*) attempt=3 ;;  # not a number: do not start again
            *) attempt="$ATTEMPT" ;;
          esac
          if [ "$attempt" -lt 3 ]; then
            gh workflow run lake-accept.yml --ref main -f "issue=$ISSUE" -f "attempt=$((attempt + 1))"
            echo "restarted=true" >> "$GITHUB_OUTPUT"  # this run's own dispatch takes the queue: no drain
            echo "started try $((attempt + 1)) of 3"
            exit 0
          fi
          printf '%s\n' "The data changed three times while this lake was being added. A team member can add the accepted label again." \
            > "$RUNNER_TEMP/failed.md"
          gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/failed.md"
          gh issue edit "$ISSUE" --add-label "rebuild failed"
          gh issue edit "$ISSUE" --remove-label accepted

      - name: Report a failed rebuild
        if: >-
          always() && needs.gate.outputs.decision == 'allowed' &&
          needs.rebuild.outputs.decision != 'refuse-changed' && needs.rebuild.outputs.decision != 'refuse-unchecked' &&
          needs.rebuild.outputs.decision != 'refuse-migrated' &&
          steps.install.outputs.result != 'changed' && steps.install.outputs.result != 'stale' &&
          steps.commit.outputs.result != 'stale' &&
          steps.live.outputs.result != 'withdrawn' &&
          !(needs.rebuild.result == 'cancelled' && needs.rebuild.outputs.started != 'true') &&
          (needs.rebuild.result != 'success' || failure() || cancelled())
        env:
          GH_TOKEN: ${{ github.token }}
          PUSHED: ${{ steps.commit.outputs.pushed }}
          DEPLOY_FAILED: ${{ steps.commit.outputs.deploy_failed }}
        run: |
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$PUSHED" = true ] && [ "$DEPLOY_FAILED" = true ]; then
            # the lake is on main: still tell the visitor and close, then say the site is not updated yet
            bash .github/scripts/apply-actions.sh "$RUNNER_TEMP/actions.json" || true
            printf '%s\n' "Published, but the site deploy did not start; run the Deploy workflow." \
              > "$RUNNER_TEMP/failed.md"
          elif [ "$PUSHED" = true ]; then
            printf 'The lake was published, but the issue could not be updated; see %s.\n' "$url" \
              > "$RUNNER_TEMP/failed.md"
          else
            printf 'The rebuild failed; see %s. Nothing was published.\n' "$url" > "$RUNNER_TEMP/failed.md"
          fi
          gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/failed.md"
          if [ "$PUSHED" != true ]; then
            gh issue edit "$ISSUE" --add-label "rebuild failed"
            # the team re-adds `accepted` to retry; until then no check run starts the accept again
            gh issue edit "$ISSUE" --remove-label accepted
          fi

      - name: Start the next waiting accept
        # at most one, the lowest-numbered (the check job's reconcile makes the same choice); never after a
        # rebuild that was queued out (two such runs would keep pushing each other out) or after this run
        # started itself again
        if: >-
          always() && steps.again.outputs.restarted != 'true' &&
          !(needs.rebuild.result == 'cancelled' && needs.rebuild.outputs.started != 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(bash .github/scripts/busy.sh)" != idle ]; then
            # another accept or refresh is active (or the lookup failed): its drain, or the daily check, starts it
            echo "Another accept or refresh is active; no accept was started." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          next="$(python3 .github/scripts/next_accept.py --feed app/public/data/requests.json --exclude "$ISSUE")" ||
            { echo "::warning::could not list the waiting accepts; the daily check starts them"; exit 0; }
          case "$next" in
            none) echo "no accept is waiting"; exit 0 ;;
            ''|*[!0-9]*) echo "::warning::next_accept.py printed no issue number"; exit 0 ;;
          esac
          gh workflow run lake-accept.yml --ref main -f "issue=$next" -f attempt=1
          echo "started the accept for issue #$next"
